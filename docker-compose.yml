services:

  # PostgreSQL + PostGIS - skladiste za vozila, putovanja, rute
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: hvr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hvr
      POSTGRES_PASSWORD: hvr_dev_password
      POSTGRES_DB: hvr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvr -d hvr"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ - asinhroni trip.events tok (trip.started -> worker -> trip.eta_updated)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hvr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: hvr
      RABBITMQ_DEFAULT_PASS: hvr_dev_password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valhalla server
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla-server
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla/tiles:/data/tiles
      - ./valhalla/config:/data/config
      - ./valhalla/custom_files:/data/custom_files
    command: valhalla_service /data/config/valhalla.json 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Valhalla graph builder
  valhalla-build:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla-build
    profiles:
      - build
    volumes:
      - ./valhalla/tiles:/data/tiles
      - ./valhalla/config:/data/config
      - ./valhalla/custom_files:/data/custom_files
    network_mode: "none"
    command: >
      sh -c "
        echo '[1/3] Generisem konfiguraciju...' &&
        valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-timezone /data/tiles/timezones.sqlite --mjolnir-admin /data/tiles/admins.sqlite > /data/config/valhalla.json &&
        echo '[2/3] Budujem routing graph (5-15 min)...' &&
        valhalla_build_tiles -c /data/config/valhalla.json /data/custom_files/serbia-hvt.osm.pbf &&
        echo '[3/3] Build zavrsen!'
        "

  # Go backend - REST API (vehicles/routes/trips), zove Valhallu za truck costing
  backend:
    build:
      context: ./backend
    container_name: hvr-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      VALHALLA_URL: "http://valhalla:8002"
      DATABASE_URL: "postgres://hvr:hvr_dev_password@postgres:5432/hvr?sslmode=disable"
      RABBITMQ_URL: "amqp://hvr:hvr_dev_password@rabbitmq:5672/"
      # Real values live in .env (gitignored, not this file) - see .env.example
      # for the template and documentations/guides/google-maps-setup.md for how
      # to obtain each one. Google sign-in / email verification are both
      # optional; the app runs fine with these left empty.
      JWT_SECRET: "${JWT_SECRET:-dev-only-insecure-secret-change-me}"
      PUBLIC_BACKEND_URL: "http://localhost:8080"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-no-reply@hvr.local}"
      # Address search (see documentations/features/2026-07-26-scope-cut-closures.md
      # Blok L) - defaults already point at the public Nominatim instance, override
      # NOMINATIM_USER_AGENT with real contact info before any non-thesis-demo use
      # (see https://operations.osmfoundation.org/policies/nominatim/).
      NOMINATIM_BASE_URL: "https://nominatim.openstreetmap.org"
      NOMINATIM_USER_AGENT: "heavy-vehicle-routing-thesis/1.0"
    ports:
      - "8080:8080"
    depends_on:
      valhalla:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata: